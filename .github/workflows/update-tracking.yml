name: Update shipment tracking

# Runs daily and can also be triggered by hand from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC ≈ 08:00/09:00 Israel time
  workflow_dispatch: {}

jobs:
  update-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/update-tracking.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEVENTEENTRACK_API_KEY: ${{ secrets.SEVENTEENTRACK_API_KEY }}
